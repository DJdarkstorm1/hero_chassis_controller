controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    fl_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 10.0
    fr_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 10.0
    bl_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 10.0
    br_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 10.0
    odom_frame: odom
    base_frame: base_link
    global_frame_mode: true
    wheel_base: 0.4
    wheel_radius: 0.07625
    wheel_track: 0.4
    # 线速度加速度限制
    max_lin_acc_x: 2.0
    max_lin_dec_x: 4.0
    max_lin_acc_y: 2.0
    max_lin_dec_y: 4.0

    # 角速度加速度限制
    max_ang_acc_z: 4.0
    max_ang_dec_z: 8.0
    max_effort: 5.0

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50
